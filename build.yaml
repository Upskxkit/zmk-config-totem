include:
  - board: seeeduino_xiao_ble
    shield: totem_left
    cmake-args: >
      -DCONFIG_ZMK_SPLIT=y
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: >
      -DCONFIG_ZMK_SPLIT=y
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  - board: nice_nano_v2
    shield: totem_dongle
    # snippet: zmk-usb-logging
    cmake-args: >
      -DZMK_KEYMAP_FILE="config/totem_dongle.keymap"

  - board: seeeduino_xiao_ble
    shield: settings_reset

  - board: nice_nano_v2
    shield: settings_reset